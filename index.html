<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Galeria de telas</title>
<link rel="icon" href="img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/galeria.css">
</head>
<body>
<div class="fundo"><i></i><i></i></div>

<header class="barra" id="barra"><div class="barra-in">
	<a class="marca" href="#" title="Voltar ao início (todas as telas)"><img src="img/logo.png" alt="brnShop"><h1>Galeria de <em>telas</em></h1></a>
	<nav class="chips" id="chips"></nav>
	<label class="busca">
		<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
		<input id="busca" type="search" placeholder="Buscar" autocomplete="off" spellcheck="false">
		<kbd>/</kbd>
	</label>
	<button class="btn" id="densidade" title="Prints menores">
		<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
	</button>
	<div class="idiomas" id="idiomas" role="group">
		<button type="button" data-idioma="pt" title="Português (Brasil)" aria-label="Português (Brasil)"><span><img src="img/flags/br.png" alt=""></span></button>
		<button type="button" data-idioma="en" title="English (US)" aria-label="English (US)"><span><img src="img/flags/us.png" alt=""></span></button>
	</div>
</div></header>

<main id="conteudo"></main>
<div class="vazio" id="vazio" hidden><b>Nenhuma tela encontrada</b>Tente outro nome ou o recurso (ex.: vrp_bank).</div>

<div id="visor" hidden role="dialog" aria-modal="true" aria-label="Visualizar print">
	<div class="v-topo">
		<b id="vTitulo"></b><span class="rec" id="vRecurso"></span><span id="vContador"></span>
		<div class="v-acoes">
			<button class="btn" id="vReal" title="Tamanho real (Espaço)">1:1</button>
			<a class="btn" id="vAbrir" target="_blank" title="Abrir a imagem">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 4h6v6M20 4l-9 9M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></svg>
			</a>
			<button class="btn" id="vFechar" title="Fechar (Esc)">✕</button>
		</div>
	</div>
	<div class="v-palco">
		<button class="btn v-seta" id="vAnt" title="Anterior (←)">‹</button>
		<div class="v-moldura" id="vMoldura"><img id="visorImg" alt=""></div>
		<button class="btn v-seta" id="vProx" title="Próximo (→)">›</button>
	</div>
	<div class="v-rodape" id="vRodape"></div>
	<div class="tiras" id="tiras"></div>
</div>

<script src="js/lista.js"></script>
<script src="js/galeria.js"></script>
</body>
</html>
